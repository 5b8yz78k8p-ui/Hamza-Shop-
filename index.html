                    id: 'escort',
                    name: 'Сопровождение',
                    icon: '🛡️',
                    category: 'service',
                    type: 'Услуга',
                    stock: 999,
                    price: 150,
                    single: true
                }
            ];

            // Элементы DOM
            const armorListEl = document.getElementById('armorList');
            const cartItemsEl = document.getElementById('cartItems');
            const totalPriceEl = document.getElementById('totalPrice');
            const receiptContentEl = document.getElementById('receiptContent');
            const orderBtn = document.getElementById('orderBtn');
            const clearCartBtn = document.getElementById('clearCartBtn');
            const categoryTabs = document.querySelectorAll('.category-tab');
            const toast = document.getElementById('toast');

            let cart = [];
            let currentCategory = 'all';
            let selectedQualities = {};
            let isSending = false;
            let cooldownTimer = null;
            let cooldownRemaining = 0;

            function startCooldown() {
                cooldownRemaining = COOLDOWN_SECONDS;
                orderBtn.disabled = true;
                updateCooldownButton();

                cooldownTimer = setInterval(() => {
                    cooldownRemaining--;
                    updateCooldownButton();

                    if (cooldownRemaining <= 0) {
                        clearInterval(cooldownTimer);
                        cooldownTimer = null;
                        orderBtn.disabled = false;
                        orderBtn.innerHTML = '📲 ОТПРАВИТЬ В WHATSAPP';
                        orderBtn.className = 'order-btn';
                    }
                }, 1000);
            }

            function updateCooldownButton() {
                if (cooldownRemaining > 0) {
                    orderBtn.innerHTML = `⏳ ПОДОЖДИТЕ <span class="timer">${cooldownRemaining}с</span>`;
                    orderBtn.className = 'order-btn';
                }
            }

            function renderProducts(category = 'all') {
                const filtered = category === 'all' 
                    ? products 
                    : products.filter(p => p.category === category);

                armorListEl.innerHTML = '';
                
                if (filtered.length === 0) {
                    armorListEl.innerHTML = '<div style="color:#5f6a7a;text-align:center;padding:20px;">Нет товаров в этой категории</div>';
                    return;
                }

                filtered.forEach(product => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'armor-item';

                    const mainDiv = document.createElement('div');
                    mainDiv.className = 'armor-main';

                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'armor-info';

                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'armor-icon';
                    iconSpan.textContent = product.icon;

                    const detailsDiv = document.createElement('div');
                    detailsDiv.className = 'armor-details';

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'armor-name';
                    nameSpan.textContent = product.name;

                    const typeSpan = document.createElement('span');
                    typeSpan.className = 'armor-type';
                    typeSpan.textContent = product.type;

                    const stockSpan = document.createElement('span');
                    stockSpan.className = `armor-stock ${product.stock === 0 ? 'out' : ''}`;
                    stockSpan.textContent = product.stock === 0 ? '❌ Нет в наличии' : `📦 В наличии: ${product.stock}`;

                    detailsDiv.appendChild(nameSpan);
                    detailsDiv.appendChild(typeSpan);
                    detailsDiv.appendChild(stockSpan);
                    infoDiv.appendChild(iconSpan);
                    infoDiv.appendChild(detailsDiv);

                    // Для услуг (без выбора качества)
                    if (product.single) {
                        const priceSpan = document.createElement('span');
                        priceSpan.className = 'armor-price';
                        priceSpan.innerHTML = `${product.price} <small>₽</small>`;

                        const controlsDiv = document.createElement('div');
                        controlsDiv.className = 'add-controls';

                        const qtyInput = document.createElement('input');
                        qtyInput.type = 'number';
                        qtyInput.className = 'qty-input';
                        qtyInput.value = 1;
                        qtyInput.min = 1;
                        qtyInput.max = product.stock;
                        qtyInput.id = `qty-${product.id}`;
                        qtyInput.disabled = product.stock === 0;

                        const addBtn = document.createElement('button');
                        addBtn.className = 'add-btn';
                        addBtn.textContent = '+';
                        addBtn.dataset.id = product.id;
                        addBtn.disabled = product.stock === 0;

                        addBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const qty = parseInt(document.getElementById(`qty-${product.id}`).value) || 1;
                            addToCart(product, null, qty);
                        });

                        controlsDiv.appendChild(qtyInput);
                        controlsDiv.appendChild(addBtn);

                        mainDiv.appendChild(infoDiv);
                        mainDiv.appendChild(priceSpan);
                        mainDiv.appendChild(controlsDiv);
                        itemDiv.appendChild(mainDiv);
                        armorListEl.appendChild(itemDiv);
                        return;
                    }

                    // Для товаров с качеством
                    const currentQualityId = selectedQualities[product.id] || product.qualities[0].id;
                    const currentQuality = product.qualities.find(q => q.id === currentQualityId) || product.qualities[0];
                    const currentPrice = currentQuality.price;

                    const priceSpan = document.createElement('span');
                    priceSpan.className = 'armor-price';
                    priceSpan.id = `price-${product.id}`;
                    priceSpan.innerHTML = `${currentPrice} <small>₽</small>`;

                    const controlsDiv = document.createElement('div');
                    controlsDiv.className = 'add-controls';

                    const qtyInput = document.createElement('input');
                    qtyInput.type = 'number';
                    qtyInput.className = 'qty-input';
                    qtyInput.value = 1;
                    qtyInput.min = 1;
                    qtyInput.max = product.stock;
                    qtyInput.id = `qty-${product.id}`;
                    qtyInput.disabled = product.stock === 0;

                    const addBtn = document.createElement('button');
                    addBtn.className = 'add-btn';
                    addBtn.textContent = '+';
                    addBtn.dataset.id = product.id;
                    addBtn.disabled = product.stock === 0;

                    addBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const qty = parseInt(document.getElementById(`qty-${product.id}`).value) || 1;
                        addToCart(product, currentQualityId, qty);
                    });

                    controlsDiv.appendChild(qtyInput);
                    controlsDiv.appendChild(addBtn);

                    mainDiv.appendChild(infoDiv);
                    mainDiv.appendChild(priceSpan);
                    mainDiv.appendChild(controlsDiv);

                    const qualityDiv = document.createElement('div');
                    qualityDiv.className = 'quality-options';

                    product.qualities.forEach(quality => {
                        const opt = document.createElement('button');
                        opt.className = `quality-option ${quality.class}`;
                        if (selectedQualities[product.id] === quality.id || 
                            (!selectedQualities[product.id] && quality.id === product.qualities[0].id)) {
                            opt.classList.add('active');
                        }
                        opt.textContent = quality.label;
                        opt.dataset.productId = product.id;
                        opt.dataset.qualityId = quality.id;

                        opt.addEventListener('click', (e) => {
                            e.stopPropagation();
                            selectedQualities[product.id] = quality.id;
                            
                            const newPrice = quality.price;
                            const priceEl = document.getElementById(`price-${product.id}`);
                            if (priceEl) {
                                priceEl.innerHTML = `${newPrice} <small>₽</small>`;
                            }

                            const parent = opt.parentElement;
                            parent.querySelectorAll('.quality-option').forEach(b => b.classList.remove('active'));
                            opt.classList.add('active');
                        });

                        qualityDiv.appendChild(opt);
                    });

                    itemDiv.appendChild(mainDiv);
                    itemDiv.appendChild(qualityDiv);
                    armorListEl.appendChild(itemDiv);
                });
            }

            function addToCart(product, qualityId, qty) {
                if (product.stock === 0) {
                    showToast('❌ Товара нет в наличии!', true);
                    return;
                }

                if (qty > product.stock) {
                    showToast(`❌ В наличии только ${product.stock} шт.`, true);
                    return;
                }

                let totalPrice;
                let qualityLabel = '';

                if (product.single) {
                    totalPrice = product.price;
                    qualityLabel = '';
                } else {
                    const quality = product.qualities.find(q => q.id === qualityId) || product.qualities[0];
                    totalPrice = quality.price;
                    qualityLabel = quality.label;
                }
                
                for (let i = 0; i < qty; i++) {
                    cart.push({
                        ...product,
                        qualityId: qualityId,
                        qualityLabel: qualityLabel,
                        price: totalPrice,
                        cartId: Date.now() + Math.random() * 1000 + i
                    });
                }
                
                product.stock -= qty;
                
                updateCartUI();
                updateReceipt();
                renderProducts(currentCategory);
                showToast(`✅ ${qty} шт. добавлено в корзину!`);
            }

            function removeFromCart(index) {
                if (index >= 0 && index < cart.length) {
                    const item = cart[index];
                    const product = products.find(p => p.id === item.id);
                    if (product) {
                        product.stock += 1;
                    }
                    cart.splice(index, 1);
                    updateCartUI();
                    updateReceipt();
                    renderProducts(currentCategory);
                }
            }

            function clearCart() {
                cart.forEach(item => {
                    const product = products.find(p => p.id === item.id);
                    if (product) {
                        product.stock += 1;
                    }
                });
                cart = [];
                updateCartUI();
                updateReceipt();
                renderProducts(currentCategory);
            }

            function updateCartUI() {
                cartItemsEl.innerHTML = '';
                if (cart.length === 0) {
                    cartItemsEl.innerHTML = '<div class="cart-empty">выберите товар</div>';
                    totalPriceEl.textContent = '0';
                    return;
                }

                const grouped = {};
                cart.forEach((item, index) => {
                    const key = item.single ? `${item.id}_single` : `${item.id}_${item.qualityId}`;
                    if (!grouped[key]) {
                        grouped[key] = { ...item, count: 0, indices: [] };
                    }
                    grouped[key].count += 1;
                    grouped[key].indices.push(index);
                });

                const sortedKeys = Object.keys(grouped).sort();

                sortedKeys.forEach(key => {
                    const gItem = grouped[key];
                    const row = document.createElement('div');
                    row.className = 'cart-item';

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'cart-item-name';
                    const qualityLabel = gItem.qualityLabel && gItem.qualityLabel !== 'Обычное' ? ` [${gItem.qualityLabel}]` : '';
                    nameSpan.textContent = `${gItem.icon} ${gItem.name}${qualityLabel} ×${gItem.count}`;

                    const priceSpan = document.createElement('span');
                    priceSpan.className = 'cart-item-price';
                    const totalItemPrice = gItem.price * gItem.count;
                    priceSpan.textContent = `${totalItemPrice} ₽`;

                    const delBtn = document.createElement('button');
                    delBtn.textContent = '✕';
                    delBtn.style.background = 'transparent';
                    delBtn.style.border = 'none';
                    delBtn.style.color = '#e74c3c';
                    delBtn.style.fontWeight = '700';
                    delBtn.style.fontSize = '16px';
                    delBtn.style.cursor = 'pointer';
                    delBtn.style.marginLeft = '8px';
                    delBtn.style.padding = '0 6px';

                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const lastIndex = gItem.indices[gItem.indices.length - 1];
                        removeFromCart(lastIndex);
                        showToast('🗑️ Товар удалён из корзины');
                    });

                    const rightWrapper = document.createElement('div');
                    rightWrapper.style.display = 'flex';
                    rightWrapper.style.alignItems = 'center';
                    rightWrapper.appendChild(priceSpan);
                    rightWrapper.appendChild(delBtn);

                    row.appendChild(nameSpan);
                    row.appendChild(rightWrapper);
                    cartItemsEl.appendChild(row);
                });

                const total = cart.reduce((sum, item) => sum + item.price, 0);
                totalPriceEl.textContent = total;
            }

            function generateReceiptText() {
                if (cart.length === 0) return '';

                const grouped = {};
                cart.forEach(item => {
                    const key = item.single ? `${item.id}_single` : `${item.id}_${item.qualityId}`;
                    if (!grouped[key]) {
                        grouped[key] = { ...item, count: 0 };
                    }
                    grouped[key].count += 1;
                });

                const sortedKeys = Object.keys(grouped).sort();
                const date = new Date();
                const dateStr = `${date.toLocaleDateString()} ${date.toLocaleTimeString()}`;

                let receiptText = `══════════════════════════\n`;
                receiptText += `  🏪 HAMZA SHOP · PUBG\n`;
                receiptText += `  ${dateStr}\n`;
                receiptText += `──────────────────────────\n`;

                let totalSum = 0;
                sortedKeys.forEach(key => {
                    const g = grouped[key];
                    const sum = g.price * g.count;
                    totalSum += sum;
                    const qualityLabel = g.qualityLabel && g.qualityLabel !== 'Обычное' ? ` [${g.qualityLabel}]` : '';
                    receiptText += `  ${g.icon} ${g.name}${qualityLabel}\n`;
                    receiptText += `    ${g.count} шт. × ${g.price} ₽ = ${sum} ₽\n`;
                });

                receiptText += `──────────────────────────\n`;
                receiptText += `  ИТОГО: ${totalSum} ₽\n`;
                receiptText += `══════════════════════════\n`;
                receiptText += `  Спасибо за покупку! 🪖`;

                return receiptText;
            }

            function updateReceipt() {
                const text = generateReceiptText();
                receiptContentEl.textContent = text;
            }

            function showToast(message, isError = false) {
                toast.textContent = message;
                toast.className = 'toast';
                if (isError) {
                    toast.classList.add('error');
                }
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            function sendOrderToWhatsApp() {
                if (isSending) return;
                if (orderBtn.disabled) return;
                
                if (cart.length === 0) {
                    showToast('❌ Корзина пуста! Добавьте товар.', true);
                    return;
                }

                isSending = true;
                orderBtn.disabled = true;
                orderBtn.textContent = '⏳ ОТКРЫВАЕМ WHATSAPP...';

                try {
                    const receiptText = generateReceiptText();
                    
                    let message = '🛒 *НОВЫЙ ЗАКАЗ HAMZA SHOP*%0A%0A';
                    message += receiptText.replace(/\n/g, '%0A');
                    message += '%0A%0A📞 Клиент: (укажите ваш ник или ID)';
                    
                    const whatsappUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${message}`;
                    
                    window.location.href = whatsappUrl;
                    
                    orderBtn.classList.add('success');
                    orderBtn.textContent = '✅ WhatsApp ОТКРЫТ';
                    showToast('✅ Открываем WhatsApp...');
                    
                    // Запускаем кулдаун после отправки
                    setTimeout(() => {
                        orderBtn.classList.remove('success');
                        isSending = false;
                        startCooldown();
                    }, 2000);
                    
                } catch (error) {
                    console.error('Ошибка:', error);
                    showToast('❌ Ошибка! Попробуйте ещё раз.', true);
                    orderBtn.textContent = '📲 ОТПРАВИТЬ В WHATSAPP';
                    orderBtn.disabled = false;
                    isSending = false;
                }
            }

            orderBtn.addEventListener('click', sendOrderToWhatsApp);

            clearCartBtn.addEventListener('click', () => {
                if (cart.length > 0) {
                    if (confirm('Очистить корзину?')) {
                        clearCart();
                        showToast('🗑️ Корзина очищена');
                    }
                } else {
                    showToast('Корзина уже пуста');
                }
            });

            categoryTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    categoryTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCategory = tab.dataset.category;
                    renderProducts(currentCategory);
                });
            });

            // Инициализация
            products.forEach(p => {
                if (!p.single) {
                    selectedQualities[p.id] = p.qualities[0].id;
                }
            });

            renderProducts('all');
            updateCartUI();
            updateReceipt();
        })();
    </script>
</body>
</html>
